  // ---------- digest slides (feed items / CVEs, for the mixed Spotlight digest) ----------

  function fmtDuration(seconds) {
    if (seconds == null) return "—";
    // Stormcast episodes run ~5 minutes, but Darknet Diaries commonly runs
    // 60-120+ — needs real H:MM:SS once it crosses an hour, not "95:02".
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = Math.floor(seconds % 60);
    const mm = h > 0 ? String(m).padStart(2, "0") : String(m);
    const ss = String(s).padStart(2, "0");
    return h > 0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
  }

  // One slide per show — the latest episode of each, Stormcast first (per
  // the explicit "after the stormcast carousel item" ordering), then any
  // other show. .slice(0,1) on the combined episode list would have almost
  // always picked Stormcast alone, since it publishes far more often than
  // Darknet Diaries; this guarantees every show actually gets a turn.
  function latestEpisodePerShow(episodes) {
    const bestByShow = {};
    for (const ep of episodes) {
      const cur = bestByShow[ep.show];
      if (!cur || (ep.published || "") > (cur.published || "")) bestByShow[ep.show] = ep;
    }
    const preferredOrder = ["stormcast", "darknetdiaries"];
    const result = preferredOrder.filter(s => bestByShow[s]).map(s => bestByShow[s]);
    Object.keys(bestByShow).forEach(s => { if (!preferredOrder.includes(s)) result.push(bestByShow[s]); });
    return result;
  }

  // Media playback can be turned off via config/site.json's
  // features.podcast.media_playback — same behavior intel.html always uses
  // (no in-page player at all): a plain outbound link to the episode's own
  // page instead of the in-page Stormcast player. Either way, "Listen now"
  // lives in the shared fixed footer slot (slide.actions) now, same as
  // every other item's outbound link — it used to sit inline in the slide's
  // own content, which meant it landed at a different position/size on
  // every podcast slide depending on how much text came before it.
  function podcastDigestSlide(ep, mediaPlaybackEnabled = true) {
    const label = `▶ Listen now · ${fmtDuration(ep.duration_seconds)}`;
    const actions = mediaPlaybackEnabled
      ? [{
          label, variant: "orange",
          onClick: () => { spOpenEpisode(ep); spotlightSyncListenButtons(); },
          attrs: { "data-role": "listen", "data-ep-id": ep.id, "data-idle-label": label },
        }]
      : (ep.episode_link ? [{ label: `${label} ↗`, href: ep.episode_link, variant: "orange", external: true }] : []);
    return {
      key: "podcast", duration: 8000,
      actions,
      html: `
        <div class="kind-tag podcast">Podcast — ${escapeHtml(ep.show_name || "")}</div>
        <div class="case-number">${escapeHtml((ep.show_name || "PODCAST").toUpperCase())} // ${escapeHtml((ep.published || "").slice(0, 10))}${ep.episode_number ? " // EPISODE " + escapeHtml(ep.episode_number) : ""}</div>
        <h1 class="redact">${escapeHtml(ep.title)}</h1>
        <p class="dossier-text">${escapeHtml((ep.summary || "").slice(0, 220))}${(ep.summary || "").length > 220 ? "…" : ""}</p>
        ${(ep.categories || []).length ? `<div class="chip-row">${ep.categories.slice(0, 6).map(c => `<span class="tag-chip">${escapeHtml(c)}</span>`).join("")}</div>` : ""}
        <a class="zoom-link stacked no-nav" href="podcast.html">full podcast archive ›</a>
      `,
    };
  }

  function feedEntryDate(e) {
    const p = e.published_sort; // [year, month(1-12), day, hour, minute, second], UTC
    if (!Array.isArray(p) || p.length < 6) return null;
    return new Date(Date.UTC(p[0], p[1] - 1, p[2], p[3], p[4], p[5]));
  }

  // Every feed item from the last 24h, newest first — but never fewer than 5,
  // so a quiet overnight doesn't leave the digest with only 1 or 2 news slides.
  function selectDigestFeedEntries(entries, { windowMs = 24 * 60 * 60 * 1000, minCount = 5 } = {}) {
    const sorted = [...entries].sort((a, b) => {
      const da = feedEntryDate(a), db = feedEntryDate(b);
      return (db ? db.getTime() : 0) - (da ? da.getTime() : 0);
    });
    const cutoff = Date.now() - windowMs;
    const withinWindow = sorted.filter(e => {
      const d = feedEntryDate(e);
      return d && d.getTime() >= cutoff;
    });
    return withinWindow.length >= minCount ? withinWindow : sorted.slice(0, minCount);
  }

  function startOfUTCDay(d) {
    return d ? Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) : null;
  }

  // NVD publishes `published`/`lastModified` as UTC timestamps but without a
  // trailing "Z" or offset (e.g. "2026-09-01T22:17:13.170") — the ECMA-262
  // date-time string format treats a time-of-day string with no zone as
  // LOCAL time, not UTC, so `new Date(cve.published)` would silently shift
  // by the reader's own offset. Appending "Z" when one isn't already present
  // forces the correct UTC interpretation.
  function cveDate(cve) {
    const raw = cve && cve.published;
    if (!raw) return null;
    const iso = /[Zz]|[+-]\d\d:?\d\d$/.test(raw) ? raw : raw + "Z";
    const d = new Date(iso);
    return isNaN(d) ? null : d;
  }

  // "Today" if the item's UTC calendar day matches the current UTC calendar
  // day, otherwise a short, human date — lets a reader place a slide in time
  // at a glance instead of doing date arithmetic themselves. Formatted in
  // UTC too (not the browser's local zone), so the label never disagrees
  // with the "Today" check it's paired with near a midnight-UTC boundary.
  function dayLabel(dateObj) {
    if (!dateObj) return "";
    if (startOfUTCDay(dateObj) === startOfUTCDay(new Date())) return "Today";
    return dateObj.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", timeZone: "UTC" });
  }

  // ---------- feature gating (config/site.json) ----------
  // See config/site.json's own _notes for the full design: a missing file,
  // a missing key, or an expired subscription all default to "enabled".
  // Disabled features aren't hidden outright here — each still shows a
  // single locked/watermarked teaser (see lockSlide), so a reader can see
  // what they're missing rather than the category just silently vanishing.

  async function loadFeatureConfig() {
    try {
      const res = await fetch(`config/site.json?t=${Date.now()}`, { cache: "no-store" });
      if (!res.ok) return null;
      const cfg = await res.json();
      const exp = cfg && cfg.subscription && cfg.subscription.exp;
      if (typeof exp === "number" && Date.now() / 1000 > exp) {
        console.warn("cti-feed config: subscription expired, falling back to defaults");
        return null;
      }
      return cfg;
    } catch { return null; }
  }
  function featureFlag(cfg, key) {
    const v = cfg && cfg.features && cfg.features[key];
    if (v == null) return true;
    if (typeof v === "boolean") return v;
    if (typeof v === "object") return v.enabled !== false;
    return true;
  }
  function featureOption(cfg, key, option, fallback) {
    const v = cfg && cfg.features && cfg.features[key];
    if (v && typeof v === "object" && option in v) return v[option];
    return fallback;
  }

  // A category's max_items override can only ever REDUCE its count below
  // the page's own built-in default — never raise it. defaultCount is
  // Infinity for categories with no fixed built-in cap (feed, podcast: see
  // config/site.json's own _notes), in which case any non-negative number
  // is honored as-is since there's no ceiling to exceed.
  function resolveMaxItems(cfg, key, defaultCount) {
    const override = featureOption(cfg, key, "max_items", null);
    if (override == null || typeof override !== "number" || !isFinite(override) || override < 0) return defaultCount;
    if (isFinite(defaultCount) && override > defaultCount) return defaultCount;
    return Math.floor(override);
  }

  // A publisher missing from features.feed.publishers (or the whole
  // "publishers" key missing) defaults to enabled — only publishers
  // explicitly turned off need listing.
  function publisherEnabled(cfg, source) {
    const feedCfg = cfg && cfg.features && cfg.features.feed;
    const pubs = feedCfg && typeof feedCfg === "object" ? feedCfg.publishers : null;
    if (!pubs || !(source in pubs)) return true;
    return pubs[source] !== false;
  }

  const FEATURE_LABELS = {
    feed: "Threat Feed", cve: "CVE Advisory", breaches: "Breach", attack: "APT Group",
    leaktracker: "Potential Ransomware Victim", negotiation: "Ransomware Group", podcast: "Podcast",
    analytics: "Analytics",
  };

  // Wraps an already-built slide as a locked teaser: strips its outbound
  // action(s) (nothing to subscribe-gate if it still links straight through)
  // and lays a translucent watermark over its content instead of hiding it
  // outright — you can see there's something there, just not read it.
  function lockSlide(slide, featureKey) {
    const label = FEATURE_LABELS[featureKey] || featureKey;
    return {
      ...slide,
      actions: [],
      locked: true,
      html: slide.html + `
        <div class="feature-lock-overlay">
          <div class="feature-lock-message">${escapeHtml(label)} Feature Classified: Subscribe for Access</div>
        </div>
      `,
    };
  }

  // Feed items and CVEs used to render as two separate blocks — every
  // selected feed item, then every selected CVE — so a quiet CVE day could
  // bury a whole run of them behind however many feed items happened to be
  // selected, or vice versa. Merging both into one list sorted by actual
  // publish date (most recent first, so today's items from either source
  // lead) interleaves them by recency instead, and each slide's dayLabel
  // ("Today" or its own date) makes that ordering legible as you page
  // through rather than just an invisible sort order.
  function mergeFeedAndCveByDate(feedEntries, cveList, feedOn, cveOn, feedCap, cveCap) {
    const feedPool = feedEntries.slice(0, feedCap);
    const cveSorted = [...cveList]
      .sort((a, b) => (cveDate(b)?.getTime() || 0) - (cveDate(a)?.getTime() || 0))
      .slice(0, cveCap);
    const items = [
      ...feedPool.map(e => {
        const d = feedEntryDate(e);
        let slide = feedItemSlide(e, dayLabel(d));
        if (!feedOn) slide = lockSlide(slide, "feed");
        return { date: d, slide };
      }),
      ...cveSorted.map(c => {
        const d = cveDate(c);
        let slide = cveDetailSlide(c, dayLabel(d));
        if (!cveOn) slide = lockSlide(slide, "cve");
        return { date: d, slide };
      }),
    ];
    items.sort((a, b) => (b.date ? b.date.getTime() : 0) - (a.date ? a.date.getTime() : 0));
    return items.map(i => i.slide);
  }

  // ---------- splash + analytics ----------

  function splashSlide() {
    return {
      key: "splash", duration: 5000,
      html: `
        <div class="splash-wrap">
          <div class="splash-kicker">// THE SIGNAL</div>

  // Monday 00:00 UTC through now — same week-boundary convention the
  // weekly-report generator uses, so "this week" means the same thing here
  // as it does there.
  function startOfCurrentUTCWeek() {
    const now = new Date();
    const diffToMonday = (now.getUTCDay() + 6) % 7; // Sun=0..Sat=6 -> days since most recent Monday
    return new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() - diffToMonday));
  }

  const ANALYTICS_COLORS = {
    critical: "var(--red)", high: "var(--amber)", medium: "var(--blue)", low: "var(--teal)", unrated: "var(--text-dim)",
  };

  // A minimal, dependency-free donut: two stacked <circle> strokes per ring
  // (a full background ring, then each segment as a dashed arc) — the same
  // stroke-dasharray technique already used for spotlight's ATT&CK coverage
  // gauges, just applied per-segment instead of one fill percentage. Colors
  // go through a style="" attribute rather than a bare stroke="" one, since
  // CSS custom properties in a plain presentation attribute aren't reliably
  // resolved across engines the way they are inside an actual style rule.
  function donutChartSvg(segments, size = 190, thickness = 24) {
    const total = segments.reduce((s, x) => s + x.value, 0) || 1;
    const r = (size - thickness) / 2;
    const c = size / 2;
    const circumference = 2 * Math.PI * r;
    let offset = 0;
    const ring = `<circle cx="${c}" cy="${c}" r="${r}" fill="none" style="stroke:var(--line)" stroke-width="${thickness}"/>`;
    const arcs = segments.map(seg => {
      const dash = (seg.value / total) * circumference;
      const arc = `<circle cx="${c}" cy="${c}" r="${r}" fill="none" style="stroke:${seg.color}" stroke-width="${thickness}" stroke-dasharray="${dash} ${circumference - dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${c} ${c})"/>`;
      offset += dash;
      return arc;
    }).join("");
    return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${ring}${arcs}</svg>`;
  }

  function analyticCveSeverity(weekCves) {
    const counts = {};
    weekCves.forEach(c => {
      const sev = ((c.cvss && c.cvss.severity) || "UNRATED").toLowerCase();
      counts[sev] = (counts[sev] || 0) + 1;
    });
    const segments = ["critical", "high", "medium", "low", "unrated"]
      .filter(k => counts[k])
      .map(k => ({ label: k, value: counts[k], color: ANALYTICS_COLORS[k] }));
    return {
      key: "analytic", duration: 7500,
      html: `
        <div class="kind-tag analytic">Analytics</div>
        <h1 class="redact analytic-title">CVE Severity — This Week</h1>
        <div class="analytic-hero">
          ${donutChartSvg(segments)}
          <div class="donut-legend">
            ${segments.length ? segments.map(s => `
              <div class="legend-row"><span class="legend-swatch" style="background:${s.color}"></span><span class="legend-label">${escapeHtml(s.label.toUpperCase())}</span><span class="legend-count">${s.value}</span></div>
            `).join("") : `<div class="legend-row">No CVE data yet this week.</div>`}
          </div>
        </div>
        <div class="analytic-context-note">${weekCves.length} Critical/High CVE${weekCves.length === 1 ? "" : "s"} published so far this week</div>
      `,
    };
  }

  function analyticKevWatch(weekCves) {
    const total = weekCves.length;
    const kevCount = weekCves.filter(c => c.kev && c.kev.in_kev).length;
    const pct = total ? Math.round((kevCount / total) * 100) : 0;
    return {
      key: "analytic", duration: 7500,
      html: `
        <div class="kind-tag analytic">Analytics</div>
        <h1 class="redact analytic-title">CISA KEV Watch</h1>
        <div class="analytic-hero">

        </div>
        <div class="stat-bar-row"><div class="stat-bar-track"><div class="stat-bar-fill" style="width:${pct}%; background:var(--red)"></div></div><div class="stat-bar-count">${pct}%</div></div>
        <div class="analytic-context-note" style="margin-top:10px;">${total ? `${pct}% of ${total} Critical/High CVE${total === 1 ? "" : "s"} this week ${kevCount === 1 ? "is" : "are"} confirmed under active exploitation` : "No CVE data yet this week."}</div>
      `,
    };
  }

  // A breakdown capped to the top N rows, with the reconciliation note that
  // fixes the "headline total doesn't match what the breakdown adds up to"
  // bug: the note always states BOTH how many rows are hidden and how much
  // volume they represent, so the displayed total is never left implying a
  // sum the visible rows don't actually produce.
  function topNWithOverflow(counts, n) {
    const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
    const top = sorted.slice(0, n);
    const rest = sorted.slice(n);
    return { top, moreRows: rest.length, moreSum: rest.reduce((s, [, v]) => s + v, 0) };
  }
  function overflowNoteHtml(moreRows, moreSum, rowNoun) {
    if (moreRows <= 0) return "";
    return `<div class="analytic-more-note">+ ${moreRows} more ${rowNoun}${moreRows === 1 ? "" : "s"} (${moreSum} not shown)</div>`;
  }

  function analyticFeedVolume(weekEntries) {
    const bySource = {};
    weekEntries.forEach(e => { const s = e.source || "Unknown"; bySource[s] = (bySource[s] || 0) + 1; });
    const { top, moreRows, moreSum } = topNWithOverflow(bySource, 6);
    const max = Math.max(1, ...top.map(([, n]) => n));
    return {
      key: "analytic", duration: 7500,
      html: `
        <div class="kind-tag analytic">Analytics</div>
        <h1 class="redact analytic-title">Feed Volume — This Week</h1>
        <div class="analytic-hero">
          <div class="big-stat"><div class="bs-number">${weekEntries.length}</div><div class="bs-label">articles captured so far this week</div></div>
        </div>
        ${top.length ? top.map(([src, n]) => `
          <div class="stat-bar-row">
            <div class="stat-bar-label">${escapeHtml(src)}</div>
            <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${(n / max * 100).toFixed(0)}%; background:var(--blue)"></div></div>
            <div class="stat-bar-count">${n}</div>
          </div>`).join("") : `<p class="dossier-text">No feed data yet this week.</p>`}
        ${overflowNoteHtml(moreRows, moreSum, "source")}
      `,
    };
  }

  function analyticTop10Cves(weekCves) {
    const top = [...weekCves].sort((a, b) => ((b.cvss && b.cvss.score) || 0) - ((a.cvss && a.cvss.score) || 0)).slice(0, 10);
    const topScore = top.length ? ((top[0].cvss && top[0].cvss.score) || 0) : 0;
    return {
      key: "analytic", duration: 7500,
      html: `
        <div class="kind-tag analytic">Analytics</div>
        <h1 class="redact analytic-title">Top 10 CVEs by Score — This Week</h1>
        <div class="analytic-hero">
          <div class="big-stat"><div class="bs-number">${topScore.toFixed(1)}</div><div class="bs-label">highest CVSS score this week</div></div>
        </div>
        <div class="analytic-context-note">out of ${weekCves.length} Critical/High CVE${weekCves.length === 1 ? "" : "s"} this week</div>
        ${top.length ? top.map((c, i) => {
          const score = (c.cvss && c.cvss.score) || 0;
          const sev = ((c.cvss && c.cvss.severity) || "unrated").toLowerCase();
          return `
          <div class="rank-row">
            <div class="rank-num">${i + 1}</div>
            <div class="rank-label">${escapeHtml(c.id)}</div>
            <div class="rank-track"><div class="rank-fill" style="width:${(score / 10 * 100).toFixed(0)}%; background:${ANALYTICS_COLORS[sev] || "var(--text-dim)"}"></div></div>
            <div class="rank-value">${score.toFixed(1)}</div>
          </div>`;
        }).join("") : `<p class="dossier-text">No CVE data yet this week.</p>`}
      `,
    };
  }

  function analyticTopRansomwareGroups(weekVictims) {
    const byGroup = {};
    weekVictims.forEach(v => { const g = v.group || "Unknown"; byGroup[g] = (byGroup[g] || 0) + 1; });
    const { top, moreRows, moreSum } = topNWithOverflow(byGroup, 6);
    const max = Math.max(1, ...top.map(([, n]) => n));
    return {
      key: "analytic", duration: 7500,
      html: `
        <div class="kind-tag analytic">Analytics</div>
        <h1 class="redact analytic-title">Top Ransomware Groups — This Week</h1>
        <div class="analytic-hero">
          <div class="big-stat"><div class="bs-number">${weekVictims.length}</div><div class="bs-label">victim postings so far this week</div></div>
        </div>
        ${top.length ? top.map(([g, n]) => `
          <div class="stat-bar-row">
            <div class="stat-bar-label">${escapeHtml(g)}</div>
            <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${(n / max * 100).toFixed(0)}%; background:var(--teal)"></div></div>
            <div class="stat-bar-count">${n}</div>
          </div>`).join("") : `<p class="dossier-text">No ransomware activity logged yet this week.</p>`}
        ${overflowNoteHtml(moreRows, moreSum, "group")}
      `,
    };
  }

  // Each analytic depends on exactly one underlying data feature and gets
  // watermarked on its own if that feature is off — independent of whether
  // "analytics" as a whole is on. If "analytics" itself is off, only the
  // first of the five appears at all, as a single locked teaser (the same
  // reduce-to-one-and-watermark pattern every other category uses).
  function buildAnalyticsSlides(threats, cves, leaktracker, cfg) {
    const weekStart = startOfCurrentUTCWeek().getTime();
    const weekCves = (cves.cves || []).filter(c => { const d = cveDate(c); return d && d.getTime() >= weekStart; });
    const weekEntries = (threats.entries || []).filter(e => { const d = feedEntryDate(e); return d && d.getTime() >= weekStart; });
    const weekVictims = (leaktracker.victims || []).filter(v => { const d = v.published ? new Date(v.published) : null; return d && !isNaN(d) && d.getTime() >= weekStart; });

    const analyticsOn = featureFlag(cfg, "analytics");
    const specs = [
      { builder: () => analyticCveSeverity(weekCves), dependsOn: "cve" },
      { builder: () => analyticKevWatch(weekCves), dependsOn: "cve" },
      { builder: () => analyticFeedVolume(weekEntries), dependsOn: "feed" },
      { builder: () => analyticTop10Cves(weekCves), dependsOn: "cve" },
      { builder: () => analyticTopRansomwareGroups(weekVictims), dependsOn: "leaktracker" },
    ];
    const chosen = analyticsOn ? specs : specs.slice(0, 1);
    return chosen.map(spec => {
      const slide = spec.builder();
      if (!analyticsOn) return lockSlide(slide, "analytics");
      if (!featureFlag(cfg, spec.dependsOn)) return lockSlide(slide, spec.dependsOn);
      return slide;
    });
  }

  function buildDigestSlides(threats, cves, attackData, groupIds, leaktracker, leaktrackerGroups, negotiationGroupNames, breaches, podcast, cfg) {
    const feedOn = featureFlag(cfg, "feed"), cveOn = featureFlag(cfg, "cve");
    const breachesOn = featureFlag(cfg, "breaches"), attackOn = featureFlag(cfg, "attack");
    const leaktrackerOn = featureFlag(cfg, "leaktracker"), negotiationOn = featureFlag(cfg, "negotiation");
    // leaktracker.watermark_victims is a separate axis from leaktracker.enabled
    // (see config/site.json's own _notes): it can lock/limit the digest's
    // victim items on their own while leaktracker.html itself stays fully
    // open. A disabled leaktracker feature already implies this regardless
    // of what watermark_victims says.
    const victimsOn = leaktrackerOn && featureOption(cfg, "leaktracker", "watermark_victims", false) !== true;
    const podcastOn = featureFlag(cfg, "podcast");
    const mediaPlaybackOn = featureOption(cfg, "podcast", "media_playback", true);
    // "ads" only governs the sponsored slides in intel.html's carousel —
    // spotlight.html doesn't have an ad-slide system to gate.

    const feedCap = feedOn ? resolveMaxItems(cfg, "feed", Infinity) : 1;
    const cveCap = cveOn ? resolveMaxItems(cfg, "cve", 10) : 1;
    const breachesCap = breachesOn ? resolveMaxItems(cfg, "breaches", 3) : 1;
    const attackCap = attackOn ? resolveMaxItems(cfg, "attack", DIGEST_GROUP_COUNT) : 1;
    const leaktrackerCap = victimsOn ? resolveMaxItems(cfg, "leaktracker", 5) : 1;
    const negotiationCap = negotiationOn ? resolveMaxItems(cfg, "negotiation", DIGEST_NEGOTIATION_GROUP_COUNT) : 1;
    const podcastCap = podcastOn ? resolveMaxItems(cfg, "podcast", Infinity) : 1;

    const splashSlides = [splashSlide()];
    const analyticsSlides = buildAnalyticsSlides(threats, cves, leaktracker, cfg);

    const podcastPool = latestEpisodePerShow(podcast.episodes || []).slice(0, podcastCap);
    const podcastSlides = podcastPool.map(ep => {
      const slide = podcastDigestSlide(ep, mediaPlaybackOn);
      return podcastOn ? slide : lockSlide(slide, "podcast");
    });

    // Disabled publishers are excluded from the pool entirely (not just
    // capped) before the normal recency/window selection runs, so a "min 5
    // items" floor only ever pulls from sources that are actually enabled.
    const feedPoolFiltered = (threats.entries || []).filter(e => publisherEnabled(cfg, e.source));
    const feedEntries = selectDigestFeedEntries(feedPoolFiltered);
    const feedAndCveSlides = mergeFeedAndCveByDate(feedEntries, cves.cves || [], feedOn, cveOn, feedCap, cveCap);

    const breachPool = (breaches.breaches || []).slice(0, breachesCap);
    const breachSlides = breachPool.map(b => {
      const slide = breachTeaserSlide(b);
      return breachesOn ? slide : lockSlide(slide, "breaches");
    });

    const groupPool = groupIds.map(gid => attackData.byId.groups[gid]).filter(Boolean).slice(0, attackCap);
    const groupSlides = groupPool.map(g => {
      const slide = groupTeaserSlide(g);
      return attackOn ? slide : lockSlide(slide, "attack");
    });

    const victimPool = (leaktracker.victims || []).slice(0, leaktrackerCap);
    const victimSlides = victimPool.map(v => {
      const slide = victimTeaserSlide(v);
      return victimsOn ? slide : lockSlide(slide, "leaktracker");
    });

    const negoPool = negotiationGroupNames.map(name => (leaktrackerGroups.groups || []).find(g => g.name === name)).filter(Boolean).slice(0, negotiationCap);
    const negotiationSlides = negoPool.map(g => {
      const slide = negotiationGroupTeaserSlide(g);
      return negotiationOn ? slide : lockSlide(slide, "negotiation");
    });

    return [...splashSlides, ...analyticsSlides, ...podcastSlides, ...feedAndCveSlides, ...breachSlides, ...groupSlides, ...victimSlides, ...negotiationSlides];
  }

  // ---------- engine ----------

  let slides = [];
  let idx = 0;
  let timerRAF = null;
  let timerStart = 0;
  let timerDuration = 0;
  let isPaused = false;
  let pauseBegan = 0;
  let interactionPaused = false;
  let pendingNavTimer = null;
  // manualPauseLock is the explicit pause/resume button's state. It takes
  // precedence over every touch/tap control: while engaged, resumeTimer()
  // refuses to run (so double-tap and swipe can't silently undo it), and a
  // freshly-entered slide starts paused instead of auto-running. Only the
  // button itself (toggleManualPause) can clear it. Built for readers who
  // can't reliably land a double-tap and need a deliberate, persistent control.
  let manualPauseLock = false;

  const SPEED_KEY = "signal-spotlight-speed";
  const SPEED_ORDER = ["normal", "slow", "slowest"];
  const SPEED_OFFSET_MS = { normal: 0, slow: 5000, slowest: 10000 };
  const SPEED_LABEL = { normal: "NORMAL", slow: "SLOW", slowest: "SLOWEST" };
  let speedMode = SPEED_ORDER.includes(localStorage.getItem(SPEED_KEY)) ? localStorage.getItem(SPEED_KEY) : "normal";

  function speedOffset() { return SPEED_OFFSET_MS[speedMode] || 0; }

  function updateSpeedButton() {
    const btn = document.getElementById("speed-btn");
    btn.textContent = `◷ ${SPEED_LABEL[speedMode]}`;
    btn.className = `speed-btn no-nav control-btn ${speedMode !== "normal" ? speedMode : ""}`;
  }

  function cycleSpeed() {
    speedMode = SPEED_ORDER[(SPEED_ORDER.indexOf(speedMode) + 1) % SPEED_ORDER.length];
    localStorage.setItem(SPEED_KEY, speedMode);
    updateSpeedButton();
    // Apply immediately to the slide already on screen, not just future ones —
    // extending timerDuration just makes the current countdown take longer to
    // fill, since it's still measured from the same timerStart.
    if (slides[idx]) timerDuration = slides[idx].duration + speedOffset();
  }

  // Hides the pause button and the tap-hint text for readers who find them
  // intrusive — persisted the same way reading speed is, so the preference
  // sticks across visits. Deliberately doesn't touch .slide-actions at all:
  // that stays fixed in place regardless, so an outbound link never shifts
  // position depending on whether the pause button happens to be showing.
  const CHROME_KEY = "signal-spotlight-chrome-hidden";
  let chromeHidden = localStorage.getItem(CHROME_KEY) === "1";

  function updateChromeToggle() {
    document.getElementById("stage").classList.toggle("chrome-hidden", chromeHidden);
    const btn = document.getElementById("chrome-toggle");
    btn.textContent = chromeHidden ? "⊙ SHOW UI" : "⊙ HIDE UI";
    btn.setAttribute("aria-pressed", String(chromeHidden));
  }

  function toggleChrome() {
    chromeHidden = !chromeHidden;
    try { localStorage.setItem(CHROME_KEY, chromeHidden ? "1" : "0"); } catch {}
    updateChromeToggle();
  }

  function updateStatusUI() {
    const flag = document.getElementById("paused-flag");
    const btn = document.getElementById("pause-btn");
    flag.classList.toggle("on", manualPauseLock || interactionPaused);
    flag.textContent = manualPauseLock ? "‖ PAUSED — TAP ▶ TO RESUME" : "‖ PAUSED — DOUBLE-TAP TO RESUME";
    btn.textContent = manualPauseLock ? "▶" : "‖";
    btn.setAttribute("aria-label", manualPauseLock ? "Resume auto-advance" : "Pause auto-advance");
    btn.classList.toggle("active", manualPauseLock);
  }

  function toggleManualPause() {
    if (manualPauseLock) {
      manualPauseLock = false;
      resumeTimer();
    } else {
      manualPauseLock = true;
      interactionPaused = false;
      if (pendingNavTimer) { clearTimeout(pendingNavTimer); pendingNavTimer = null; }
      pauseTimer();
    }
    updateStatusUI();
  }

  function renderChrome() {
    document.getElementById("case-id").textContent = isDigest
      ? "SIGNAL // SPOTLIGHT // DIGEST"
      : `SIGNAL // SPOTLIGHT // ${TYPE_META[type].pageLabel} // ${domain.toUpperCase()}`;
    document.getElementById("progress-bar").innerHTML = slides.map(() => `<div class="seg"><div class="seg-fill"></div></div>`).join("");
  }

  function renderSlides() {
    const root = document.getElementById("slides");
    root.innerHTML = slides.map((s, i) => `
      <div class="slide" data-i="${i}" data-key="${s.key}">
        <div class="slide-inner">${s.html}</div>
      </div>`).join("");
    slides.forEach((s, i) => {
      if (s.onMount) s.onMount(root.querySelector(`.slide[data-i="${i}"]`));
    });
  }

  function segFills() { return [...document.querySelectorAll(".seg-fill")]; }

  function setSegProgress(i, pct) {
    const fills = segFills();
    if (fills[i]) fills[i].style.width = pct + "%";
  }

  function syncSegsForIndex(i) {
    segFills().forEach((fill, si) => { fill.style.width = si < i ? "100%" : si > i ? "0%" : fill.style.width; });
  }

  function cancelTimer() {
    if (timerRAF) cancelAnimationFrame(timerRAF);
    timerRAF = null;
  }

  function startTimer(duration) {
    cancelTimer();
    timerDuration = duration;
    timerStart = performance.now();
    // A manual pause persists across navigation — a slide reached while paused
    // starts paused too, rather than silently resuming autoplay behind the reader.
    isPaused = manualPauseLock;
    if (isPaused) pauseBegan = timerStart;
    updateStatusUI();
    if (REDUCED_MOTION) { setSegProgress(idx, manualPauseLock ? 0 : 100); return; }
    setSegProgress(idx, 0);
    tick();
  }

  function tick() {
    if (!isPaused) {
      const elapsed = performance.now() - timerStart;
      const frac = Math.min(1, elapsed / timerDuration);
      setSegProgress(idx, frac * 100);
      if (frac >= 1) { timerRAF = null; next(true); return; }
    }
    timerRAF = requestAnimationFrame(tick);
  }

  function pauseTimer() { if (!isPaused) { isPaused = true; pauseBegan = performance.now(); } updateStatusUI(); }
  function resumeTimer() {
    if (manualPauseLock) return; // locked — only the pause/resume button can clear this
    if (isPaused) { isPaused = false; timerStart += performance.now() - pauseBegan; }
    updateStatusUI();
  }

  // Swaps the fixed footer slot between the generic navigation hint and any
  // slide-specific outbound link(s) — see the .slide-actions CSS comment
  // for why these live here instead of inline in the slide's own content.
  // Actions normally navigate (href), but one (the podcast "Listen now"
  // control, when the in-page player is enabled) needs to trigger JS
  // instead of going anywhere — onClick renders a <button> in the same slot
  // with the same look rather than an <a>. attrs carries through any extra
  // data-* attributes a caller needs on the rendered element (podcast uses
  // this to keep its existing play-state sync working against whichever
  // button is currently in this slot).
  function updateSlideActions(slide) {
    const container = document.getElementById("slide-actions");
    const hint = document.getElementById("hint");
    const actions = (slide && slide.actions) || [];
    container.innerHTML = actions.map((a, i) => {
      const cls = `slide-action-btn${a.variant ? " " + a.variant : ""}`;
      const attrs = a.attrs ? Object.entries(a.attrs).map(([k, v]) => ` ${k}="${escapeHtml(String(v))}"`).join("") : "";
      if (a.onClick) return `<button type="button" class="${cls}" data-action-i="${i}"${attrs}>${escapeHtml(a.label)}</button>`;
      return `<a class="${cls}" href="${escapeHtml(a.href)}"${a.external ? ' target="_blank" rel="noopener noreferrer"' : ""}${attrs}>${escapeHtml(a.label)}</a>`;
    }).join("");
    actions.forEach((a, i) => {
      if (!a.onClick) return;
      const btn = container.querySelector(`[data-action-i="${i}"]`);
      if (btn) btn.addEventListener("click", (e) => { e.stopPropagation(); a.onClick(); });
    });
    container.classList.toggle("visible", actions.length > 0);
    hint.classList.toggle("suppressed", actions.length > 0);
  }

  function goTo(i) {
    if (i < 0 || i >= slides.length) return;
    const root = document.getElementById("slides");
    root.querySelectorAll(".slide").forEach(el => el.classList.remove("active"));
    idx = i;
    root.querySelector(`.slide[data-i="${i}"]`).classList.add("active");
    syncSegsForIndex(i);
    updateSlideActions(slides[i]);
    // The action button is rebuilt fresh on every navigation (unlike the
    // old inline button, which stayed in the DOM — and kept its synced
    // "Playing" state — even while its slide was inactive), so landing on
    // a podcast slide while that exact episode is already playing needs an
    // explicit re-sync here rather than waiting for the next audio event.
    if (typeof spotlightSyncListenButtons === "function") spotlightSyncListenButtons();
    interactionPaused = false;
    if (pendingNavTimer) { clearTimeout(pendingNavTimer); pendingNavTimer = null; }
    startTimer(slides[i].duration + speedOffset());
  }

  function next() {
    // The carousel loops indefinitely — past the last slide it wraps back to the first,
    // whether that's a single-entity dossier or the mixed digest.
    goTo(idx < slides.length - 1 ? idx + 1 : 0);
  }
  function prev() { goTo(idx > 0 ? idx - 1 : slides.length - 1); }

  function setupInput() {
    const stage = document.getElementById("stage");
    let downAt = null, downX = 0, downY = 0, moved = false, downOnNoNav = false;
    let lastTapAt = 0;
    let suppressNextClick = false;
    const DOUBLE_TAP_MS = 340;

    document.getElementById("pause-btn").addEventListener("click", (e) => {
      e.stopPropagation();
      toggleManualPause();
    });

    document.getElementById("speed-btn").addEventListener("click", (e) => {
      e.stopPropagation();
      cycleSpeed();
    });
    updateSpeedButton();

    document.getElementById("chrome-toggle").addEventListener("click", (e) => {
      e.stopPropagation();
      toggleChrome();
    });
    updateChromeToggle();

    // Capture phase so this runs before a link's own navigation (or an
    // asset-card's own click-to-expand handler) fires.
    stage.addEventListener("click", (e) => {
      if (suppressNextClick) {
        e.preventDefault();
        e.stopPropagation();
        suppressNextClick = false;
      }
    }, true);

    function performNav(clientX) {
      const w = window.innerWidth;
      if (clientX < w * 0.3) prev(); else next();
    }

    // A swipe always navigates, even if it starts on a card or link — a card-dense
    // slide (Arsenal, Connections) must never trap the user with no way to move on.
    //
    // A short tap on an interactive element (.no-nav) pauses the auto-advance timer
    // and KEEPS it paused — it does not resume on its own. Only a double-tap resumes
    // it (continuing the current slide's countdown toward the next slide). A single
    // background tap while paused this way is held for one double-tap window before
    // falling through to normal prev/next, so the two gestures don't collide.
    stage.addEventListener("pointerdown", (e) => {
      // The pause and speed buttons fully own their own click behavior (including
      // managing pause state themselves) — they must never enter the generic
      // swipe/tap tracking below, or a tap on them would also trip the "tapped a
      // .no-nav element" pause-until-double-tap path as an unrelated side effect.
      if (e.target.closest(".control-btn")) return;
      // Starting a drag on top of a real <a> would otherwise trigger the browser's
      // native "drag this link" gesture instead of our pointermove tracking, which
      // silently swallows a swipe that happens to start on a link-heavy slide (e.g.
      // Connections). preventDefault here suppresses only that native drag — the
      // link's own click-driven navigation on release is unaffected.
      if (e.target.closest("a")) e.preventDefault();
      downAt = performance.now(); downX = e.clientX; downY = e.clientY; moved = false;
      downOnNoNav = !!e.target.closest(".no-nav");
      pauseTimer();
    });
    stage.addEventListener("pointermove", (e) => {
      if (downAt == null) return;
      if (Math.abs(e.clientX - downX) > 10 || Math.abs(e.clientY - downY) > 10) moved = true;
    });
    stage.addEventListener("pointerup", (e) => {
      if (downAt == null) return;
      const heldMs = performance.now() - downAt;
      const dx = e.clientX - downX;
      const wasOnNoNav = downOnNoNav;
      downAt = null;

      if (moved && Math.abs(dx) > 60) {
        // A drag that starts AND ends over the same <a> (a wide row like an
        // associate-row spans most of the slide width) still fires a native
        // click on release regardless of distance traveled — unlike touch,
        // mouse click-detection doesn't care how far you moved in between.
        // Since we've already treated this as a swipe, suppress that click.
        suppressNextClick = true;
        interactionPaused = false;
        if (pendingNavTimer) { clearTimeout(pendingNavTimer); pendingNavTimer = null; }
        resumeTimer();
        if (dx < 0) next(); else prev();
        return;
      }

      if (heldMs < 250 && !moved) {
        const now = performance.now();
        const isDoubleTap = (now - lastTapAt) < DOUBLE_TAP_MS;
        lastTapAt = isDoubleTap ? 0 : now;

        if (isDoubleTap && interactionPaused) {
          if (pendingNavTimer) { clearTimeout(pendingNavTimer); pendingNavTimer = null; }
          interactionPaused = false;
          resumeTimer();
          return;
        }

        if (wasOnNoNav) {
          interactionPaused = true;
          pauseTimer();
          return;
        }

        if (interactionPaused) {
          if (pendingNavTimer) clearTimeout(pendingNavTimer);
          const clientX = e.clientX;
          pendingNavTimer = setTimeout(() => { pendingNavTimer = null; performNav(clientX); }, DOUBLE_TAP_MS);
          return;
        }

        performNav(e.clientX);
        return;
      }
      resumeTimer();
    });
    stage.addEventListener("pointercancel", () => { downAt = null; resumeTimer(); });

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") next();
      else if (e.key === "ArrowLeft") prev();
      else if (e.key === "Escape") { const el = document.getElementById("exit-link"); if (el) location.href = el.href; }
    });
  }

  function setupBackLink() {
    const el = document.getElementById("exit-link");
    if (fromUrl) { el.href = fromUrl; el.textContent = `‹ ${fromName || "back"}`; }
    else if (isDigest) { el.href = "index.html"; el.textContent = "‹ EXIT"; }
    else { el.href = "attack.html"; el.textContent = "‹ EXIT"; }
  }

  const DIGEST_GROUP_COUNT = 3;
  const DIGEST_NEGOTIATION_GROUP_COUNT = 3;

  async function loadDigestData() {
    const [attackR, threatsR, cveR, leaktrackerR, leaktrackerGroupsR, breachesR, podcastR] = await Promise.allSettled(
      [loadDomain(), loadThreats(), loadCveLatest(), loadLeaktrackerLatest(), loadLeaktrackerGroups(), loadBreachesLatest(), loadPodcastLatest()]
    );
    if (attackR.status === "rejected") console.error("digest: ATT&CK data failed to load", attackR.reason);
    if (threatsR.status === "rejected") console.error("digest: feed data failed to load", threatsR.reason);
    if (cveR.status === "rejected") console.error("digest: CVE data failed to load", cveR.reason);
    if (leaktrackerR.status === "rejected") console.error("digest: leak-tracker data failed to load", leaktrackerR.reason);
    if (leaktrackerGroupsR.status === "rejected") console.error("digest: leak-tracker groups failed to load", leaktrackerGroupsR.reason);
    if (breachesR.status === "rejected") console.error("digest: breach data failed to load", breachesR.reason);
    if (podcastR.status === "rejected") console.error("digest: podcast data failed to load", podcastR.reason);
    return {
      attackData: attackR.status === "fulfilled" ? attackR.value : null,
      threats: threatsR.status === "fulfilled" ? threatsR.value : { entries: [] },
      cves: cveR.status === "fulfilled" ? cveR.value : { cves: [] },
      leaktracker: leaktrackerR.status === "fulfilled" ? leaktrackerR.value : { victims: [] },
      leaktrackerGroups: leaktrackerGroupsR.status === "fulfilled" ? leaktrackerGroupsR.value : { groups: [] },
      breaches: breachesR.status === "fulfilled" ? breachesR.value : { breaches: [] },
      podcast: podcastR.status === "fulfilled" ? podcastR.value : { episodes: [] },
    };
  }

  async function initDigest() {
    const [{ attackData, threats, cves, leaktracker, leaktrackerGroups, breaches, podcast }, featureConfig] =
      await Promise.all([loadDigestData(), loadFeatureConfig()]);

    const validGroupIds = attackData ? attackData.groups.map(g => g.id) : [];
    let groupIds = (params.get("groups") || "").split(",").map(s => s.trim()).filter(gid => validGroupIds.includes(gid));

    const validNegotiationNames = (leaktrackerGroups.groups || []).filter(g => g.negotiation && g.negotiation.available).map(g => g.name);
    let negotiationGroupNames = (params.get("negoGroups") || "").split(",").map(s => s.trim()).filter(n => validNegotiationNames.includes(n));

    // No (valid) group set pinned in the URL yet — pick DIGEST_GROUP_COUNT at
    // random and bake them into the URL via replaceState, so reloading or
    // backing out of a zoomed-in sub-entity returns to this *same* set rather
    // than a fresh roll.
    let pinUrl = false;
    if (groupIds.length < DIGEST_GROUP_COUNT && validGroupIds.length >= DIGEST_GROUP_COUNT) {
      const pool = [...validGroupIds];
      groupIds = [];
      while (groupIds.length < DIGEST_GROUP_COUNT && pool.length) {
        groupIds.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
      }
      pinUrl = true;
    }
    if (negotiationGroupNames.length < DIGEST_NEGOTIATION_GROUP_COUNT && validNegotiationNames.length >= DIGEST_NEGOTIATION_GROUP_COUNT) {
      const pool = [...validNegotiationNames];
      negotiationGroupNames = [];
      while (negotiationGroupNames.length < DIGEST_NEGOTIATION_GROUP_COUNT && pool.length) {
        negotiationGroupNames.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
      }
      pinUrl = true;
    } else if (negotiationGroupNames.length === 0 && validNegotiationNames.length) {
      // Fewer matched groups than DIGEST_NEGOTIATION_GROUP_COUNT overall —
      // still show whatever's available rather than nothing.
      negotiationGroupNames = validNegotiationNames;
      pinUrl = true;
    }
    if (pinUrl) {
      const p = new URLSearchParams(location.search);
      p.set("mode", "digest");
      p.set("domain", domain);
      p.set("groups", groupIds.join(","));
      p.set("negoGroups", negotiationGroupNames.join(","));
      history.replaceState(null, "", `spotlight.html?${p.toString()}`);
    }

    slides = buildDigestSlides(threats, cves, attackData || { byId: { groups: {} } }, groupIds, leaktracker, leaktrackerGroups, negotiationGroupNames, breaches, podcast, featureConfig);
    if (slides.length === 0) {
      showEmptyTarget("No feed, CVE, ATT&CK, or leak-tracker data available yet — have the fetch scripts been run?");
      return;
    }

    setupBackLink();
    renderChrome();
    renderSlides();
    setupInput();
    goTo(0);
  }

  // ---------- negotiation replay: a leaked ransom-chat transcript played
  // back as speech bubbles instead of a slide deck. Reuses the shared
  // pause/speed engine (manualPauseLock, speedOffset, isPaused/timerStart)
  // so the same controls that pace the digest also pace this, but drives
  // its own reveal loop (revealUpTo) since "advance" here means "reveal the
  // next message", not "swipe to the next slide" — the whole transcript is
  // fetched and rendered up front, and messages are just faded in in order. ----------

  const NEGOTIATION_URL_PREFIX = "https://raw.githubusercontent.com/Casualtek/Ransomchats/";
  // Must match .chat-scroll's padding-bottom in the CSS above — how far a
  // freshly-revealed message is kept clear of the pause/speed buttons, which
  // float on top of the scroll area rather than reserving their own space.
  const CONTROL_CLEARANCE_PX = 140;
  let negoMessages = [];
  let negoRevealed = 0;
  // Whether auto-reveal should keep scrolling the transcript to follow the
  // newest message — true until the reader deliberately scrolls away from
  // the current frontier to read back, and re-armed by the resume button.
  let negoFollowing = true;
  // A smooth scrollTo() we trigger ourselves still fires a stream of native
  // 'scroll' events while it animates, each with a scrollTop that hasn't
  // reached the target yet — treating those as "the reader scrolled away"
  // would cancel following on literally every auto-scroll. This is a
  // deadline (performance.now()-based), not a boolean, so a second
  // auto-scroll fired before the first settles doesn't get its own window
  // closed early by the first one's cleanup.
  let negoProgrammaticScrollUntil = 0;

  function cleanChatContent(raw) {
    return (raw || "").trim().replace(/^>\s?/, "");
  }

  function negoMessageDuration(content) {
    const words = (content || "").split(/\s+/).filter(Boolean).length;
    return Math.max(1800, Math.min(7000, 900 + words * 160));
  }

  function renderNegotiationChrome(groupName, label) {
    document.getElementById("case-id").textContent = `SIGNAL // NEGOTIATION // ${escapeHtml(groupName).toUpperCase()} // ${label}`;
    const stampEl = document.getElementById("stamp");
    stampEl.innerHTML = "LEAKED<br>TRANSCRIPT";
    stampEl.hidden = false;
    document.getElementById("progress-bar").innerHTML = `<div class="seg"><div class="seg-fill" id="nego-progress-fill"></div></div>`;
    document.getElementById("stage").classList.add("negotiation-mode");
  }

  function renderNegotiationMessages() {
    document.getElementById("slides").innerHTML = `
      <div class="chat-scroll" id="chat-scroll">
        ${negoMessages.map((m, i) => `
          <div class="chat-msg ${m.party}" data-i="${i}">
            <div class="chat-bubble">${escapeHtml(m.content)}</div>
            <div class="chat-meta">${escapeHtml(m.partyLabel)}</div>
          </div>
        `).join("")}
        <div class="chat-end" id="chat-end">— end of transcript —</div>
      </div>`;
  }

  function setNegoProgress(pct) {
    const fill = document.getElementById("nego-progress-fill");
    if (fill) fill.style.width = pct + "%";
  }

  // The scroll target that keeps the last REVEALED message clear of the
  // floating controls. Deliberately not based on root.scrollHeight/clientHeight
  // alone — every message (including ones not revealed yet) is already in the
  // DOM with real layout height so "scroll ahead" has something to scroll
  // into, which means scrollHeight reflects the *whole* transcript from the
  // first render, not just what's currently visible. Anchoring on the last
  // revealed element's own position instead keeps this correct regardless of
  // how much still-invisible content sits below it.
  function frontierScrollTarget() {
    const root = document.getElementById("chat-scroll");
    const lastEl = root.querySelector(`.chat-msg[data-i="${negoRevealed - 1}"]`);
    if (!lastEl) return 0;
    const raw = lastEl.offsetTop + lastEl.offsetHeight - root.clientHeight + CONTROL_CLEARANCE_PX;
    return Math.max(0, Math.min(raw, root.scrollHeight - root.clientHeight));
  }

  function scrollToFrontier(smooth) {
    const root = document.getElementById("chat-scroll");
    const useSmooth = smooth && !REDUCED_MOTION;
    // Generous window for a smooth scroll to settle — it only ever needs to
    // cover a message or two's worth of distance, never the whole transcript.
    negoProgrammaticScrollUntil = performance.now() + (useSmooth ? 700 : 50);
    root.scrollTo({ top: frontierScrollTarget(), behavior: useSmooth ? "smooth" : "auto" });
  }

  function revealUpTo(n) {
    n = Math.min(n, negoMessages.length);
    if (n <= negoRevealed) return;
    const root = document.getElementById("chat-scroll");
    for (let i = negoRevealed; i < n; i++) {
      const el = root.querySelector(`.chat-msg[data-i="${i}"]`);
      if (el) el.classList.add("visible");
    }
    negoRevealed = n;
    setNegoProgress((negoRevealed / negoMessages.length) * 100);
    if (negoRevealed >= negoMessages.length) {
      document.getElementById("chat-end").classList.add("visible");
    }
    if (negoFollowing) scrollToFrontier(true);
  }

  function cancelNegoTimer() { if (timerRAF) cancelAnimationFrame(timerRAF); timerRAF = null; }

  function startNegoMessageTimer() {
    cancelNegoTimer();
    if (negoRevealed >= negoMessages.length) return;
    if (REDUCED_MOTION) { revealUpTo(negoMessages.length); return; }
    timerDuration = negoMessageDuration(negoMessages[negoRevealed].content) + speedOffset();
    timerStart = performance.now();
    isPaused = manualPauseLock;
    if (isPaused) pauseBegan = timerStart;
    updateStatusUI();
    negoTick();
  }

  function negoTick() {
    if (negoRevealed >= negoMessages.length) { timerRAF = null; return; }
    if (!isPaused) {
      const elapsed = performance.now() - timerStart;
      if (elapsed >= timerDuration) {
        revealUpTo(negoRevealed + 1);
        timerRAF = null;
        startNegoMessageTimer();
        return;
      }
    }
    timerRAF = requestAnimationFrame(negoTick);
  }

  function setupNegotiationInput() {
    document.getElementById("pause-btn").addEventListener("click", (e) => {
      e.stopPropagation();
      const wasPaused = manualPauseLock;
      toggleManualPause();
      // Resuming re-arms auto-scroll and snaps straight back to the current
      // frontier — a paused reader may have scrolled off anywhere to read
      // back, and resume should pick up the reveal where it left off, in view,
      // not silently keep revealing off-screen until they scroll down again.
      if (wasPaused) { negoFollowing = true; scrollToFrontier(true); }
    });
    document.getElementById("speed-btn").addEventListener("click", (e) => { e.stopPropagation(); cycleSpeed(); });
    updateSpeedButton();
    document.getElementById("chrome-toggle").addEventListener("click", (e) => { e.stopPropagation(); toggleChrome(); });
    updateChromeToggle();

    const root = document.getElementById("chat-scroll");
    root.addEventListener("scroll", () => {
      // Ignore scroll events fired by our own in-flight auto-scroll — a smooth
      // scrollTo() reports intermediate scrollTop values on every frame while
      // it animates, which would otherwise read as "the reader scrolled away"
      // on essentially every single auto-reveal.
      if (performance.now() < negoProgrammaticScrollUntil) return;

      // "Following" means the reader is sitting at the current frontier —
      // compare against that message's own scroll position, not against
      // root.scrollHeight, which already includes not-yet-revealed messages'
      // reserved (but invisible) height and would never read as "near bottom".
      negoFollowing = Math.abs(root.scrollTop - frontierScrollTarget()) < 48;

      // Scrolling past the reveal frontier (deliberately reading ahead) should
      // just show those messages immediately, rather than leaving blank gaps —
      // and playback, once resumed, continues from wherever that landed instead
      // of replaying from the old position.
      let revealTo = negoRevealed;
      const scrollBottom = root.scrollTop + root.clientHeight;
      root.querySelectorAll(".chat-msg:not(.visible)").forEach(el => {
        if (el.offsetTop < scrollBottom + 40) {
          revealTo = Math.max(revealTo, parseInt(el.dataset.i, 10) + 1);
        }
      });
      if (revealTo > negoRevealed) {
        const wasFollowing = negoFollowing;
        negoFollowing = false; // don't fight a manual upward/ahead scroll with an auto-scroll
        revealUpTo(revealTo);
        negoFollowing = wasFollowing;
        if (!isPaused) startNegoMessageTimer();
      }
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") { const el = document.getElementById("exit-link"); if (el) location.href = el.href; }
    });
  }

  async function initNegotiation() {
    const chatUrl = params.get("chat") || "";
    const groupName = params.get("group") || "Unknown group";
    const rawLabel = params.get("label") || "latest";
    const label = rawLabel === "longest" ? "LONGEST TRANSCRIPT"
      : rawLabel === "latest" ? "LATEST TRANSCRIPT"
      : `TRANSCRIPT · ${rawLabel.toUpperCase()}`;
    const backHref = `leaktracker.html?group=${encodeURIComponent(groupName)}`;

    setupBackLink();
    renderNegotiationChrome(groupName, label);

    // The chat URL arrives via a query param — only ever fetch it if it's
    // actually pointing at the trusted Ransomchats archive, not wherever a
    // tampered link might point.
    if (!chatUrl.startsWith(NEGOTIATION_URL_PREFIX)) {
      showEmptyTarget("This negotiation link isn't from a trusted source, so it wasn't loaded.", backHref, groupName);
      return;
    }

    let chat;
    try {
      const res = await fetch(chatUrl, { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      chat = await res.json();
    } catch (err) {
      showEmptyTarget("Couldn't load this negotiation transcript.", backHref, groupName);
      console.error(err);
      return;
    }

    negoMessages = (chat.messages || [])
      .map(m => {
        const isVictim = (m.party || "").trim().toLowerCase() === "victim";
        return {
          party: isVictim ? "victim" : "them",
          partyLabel: m.party || (isVictim ? "Victim" : groupName),
          content: cleanChatContent(m.content),
        };
      })
      .filter(m => m.content);

    if (negoMessages.length === 0) {
      showEmptyTarget("This transcript has no messages.", backHref, groupName);
      return;
    }

    renderNegotiationMessages();
    setupNegotiationInput();
    revealUpTo(1);
    startNegoMessageTimer();
  }

  // ---------- podcast "Listen now" button state ----------
  // Starting playback is just spOpenEpisode() from the shared Stormcast
  // player module (see the block above, identical on every page) — this
  // page only needs to keep its own "Listen now" button's label/style in
  // sync with whether that shared player is currently on this episode.
  // audio's "emptied" event conveniently fires exactly when spCloseFully()
  // clears the src, so it doubles as the "player was closed" signal.

  function spotlightSyncListenButtons() {
    const bar = spEl("sp-bar");
    // Only the current slide's action button (if any) ever exists in the
    // DOM now — updateSlideActions rebuilds #slide-actions fresh on every
    // goTo() — so this finds at most one match, not one per podcast slide.
    document.querySelectorAll('[data-role="listen"]').forEach(b => {
      const isThisOne = !bar.hidden && spState.episode && spState.episode.id === b.dataset.epId;
      b.classList.toggle("playing", isThisOne);
      b.textContent = isThisOne ? "♪ Playing — see player below" : b.dataset.idleLabel;
    });
  }

  function wireSpotlightPodcastSync() {
    const audio = spEl("sp-audio");
    audio.addEventListener("play", spotlightSyncListenButtons);
    audio.addEventListener("pause", spotlightSyncListenButtons);
    audio.addEventListener("emptied", spotlightSyncListenButtons);
  }

  async function init() {
    spInit();
    wireSpotlightPodcastSync();
    spotlightSyncListenButtons();
    if (isNegotiation) { await initNegotiation(); return; }
    if (isDigest) { await initDigest(); return; }

    let data;
    try { data = await loadDomain(); }
    catch (err) { showEmptyTarget(`Couldn't load ${domain} data. Has scripts/fetch_attack.py been run yet?`); console.error(err); return; }

    const entity = data.byId[type] && data.byId[type][id];
    if (!entity) { showEmptyTarget(`No record for "${escapeHtml(id)}" in the ${domain} domain.`); return; }

    setupBackLink();
    const selfLabel = type === "techniques" ? techniqueLabel(entity, data) : entity.name;

    if (type === "groups") slides = buildGroupSlides(entity, data, selfLabel);
    else if (type === "techniques") slides = buildTechniqueSlides(entity, data, selfLabel);
    else if (type === "software") slides = buildSoftwareSlides(entity, data, selfLabel);

    renderChrome();
    renderSlides();
    setupInput();
    goTo(0);
  }

  init();
})();
</script>
